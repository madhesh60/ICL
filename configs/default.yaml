# Cairn settings.  Every key is checked at start-up: a typo is an error, not a silent no-op.
# Run with:  cairn --config configs/default.yaml <command>
#
# Per-task overrides at the bottom carry the evidence they rest on.  "E000" is the first
# real Qwen3-4B run (2 x T4, 20 dev inputs per task, 2026-11-16); see
# docs/04_EXPERIMENT_LOG.md and docs/06_FIRST_REAL_RUN.md.  Twenty inputs is a weak
# measurement (95% range about +/-20 points), so each override also states the reason the
# number is believable, not just the number.

backend:
  kind: openai                         # any OpenAI-style server: vLLM, FlagScale, llama.cpp ...
  base_url: http://127.0.0.1:2026/v1
  model: Qwen3-4B
  structured_api: structured_outputs   # vLLM >= 0.12.  Older vLLM: guided.  No support: none.
  thinking_control: true               # send chat_template_kwargs.enable_thinking
  timeout_s: 600
  max_attempts: 5
  response_cache: true                 # keep answers on disk; reruns and resumes are free

defaults:
  workers: 8
  split_seed: 42
  calib_limit: 300
  splits:
    calib: 300        # fits calibration + conformal threshold, verifies induced programs
    dev: 300          # compares strategies; never appears in a prompt
    holdout: 200      # touched once, at the very end
  context:
    selection: coverage         # coverage | random | first
    coverage_target: queries    # cover what the inputs we must label look like
    label_balance: 0.5          # 0 = natural label shares, 1 = equal shares
    bulk_order: interleave      # no long runs of one label
    n_clusters: 1               # prompt beginnings per task (1 = maximum cache reuse)
    global_frac: 0.5            # with clusters: share of examples common to all of them
    tail_k: 12                  # nearest examples placed right before the input
    tail_per_label: 2           # ...including the nearest of every label
    tail_as_turns: true         # nearest examples as real chat turns
    restate_rule: true          # repeat the output rule right before the input
  strategy:
    use_program: true           # exact tasks: model writes a program, we verify it
    induction_examples: 48      # the program-writing prompt shows this many examples (not 30K tokens)
    induction_max_tokens: 4096  # room for thinking AND the code; E000 ran out at 2048 and got no code
    induction_rounds: 4
    use_scoring: true           # classification: read label probabilities
    calibration: stack          # none | batch | vector | stack (stack adds model-free signals)
    conformal_alpha: 0.1        # allowed miss rate of the "plausible labels" set
    min_singleton_accuracy: 0.85  # the cheap rung may stop the ladder only if its sure answers
                                  # were this accurate on held-out examples (E000 task 2: 29%)
    escalate: true              # unsure -> think + vote
    vote_n: 5
    think_max_tokens: 1024
    think_temperature: 0.6      # Qwen3's recommended sampling for thinking mode
    cheap_samples: 3
    agree_share: 0.67
    induce_guidelines: false    # turn on per task after `cairn tune` says it helps

tasks:
  # Exact-procedure tasks.  The program path should answer everything; the settings below
  # are the backup for inputs (or runs) where it does not.  E000: 15% of task-1 inputs got no
  # valid answer from 5 thinking votes at 1024 tokens; working through 45 pairwise
  # differences needs more room than that.
  1: { context: { tail_k: 8 }, strategy: { think_max_tokens: 2048 } }
  3: { context: { tail_k: 8 }, strategy: { think_max_tokens: 2048 } }
  4: { context: { tail_k: 8 }, strategy: { think_max_tokens: 2048 } }
  # Counting nouns/verbs.  E000: one-token scoring was right on 29% of the inputs it was
  # sure about; thinking + voting was right on 92%.  The reason is structural, not noise:
  # counting needs the words to be listed, which a single next-token guess cannot do.
  2: { strategy: { use_scoring: false, think_max_tokens: 768 } }
  # Tweet sadness.  E000: the scoring rung (stacked calibration) was right on 87% of the
  # inputs it was sure about; thinking + voting on the unsure rest was right on 1 of 5.
  # Binary sentiment is a surface judgement a 4B model makes better fast than slow, so
  # unsure inputs take the calibrated best guess instead.  Re-test with >= 100 inputs.
  5: { strategy: { escalate: false } }
  # Same genre: the sentence-overlap signal carries it (E000: 100% on the 90% sure inputs).
  # Escalation stays on; it touches few inputs and 1-of-2 is no evidence either way.
  6: {}
  7:
    context: { n_clusters: 4, tail_k: 16 }      # trivia: topic-specific examples help the tail
  8:
    workers: 4
    context: { n_clusters: 4, tail_k: 3 }       # kernels are long; 3 nearest ones is plenty
    strategy: { codegen_rounds: 3, codegen_candidates: 2, codegen_execute: true }
