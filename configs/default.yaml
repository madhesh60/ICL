# Cairn settings.  Every key is checked at start-up: a typo is an error, not a silent no-op.
# Run with:  cairn --config configs/default.yaml <command>
#
# Per-task overrides at the bottom carry the evidence they rest on.  E000 = first real
# Qwen3-4B run (2 x T4, 20 dev inputs/task, 2026-11-16, docs/06_FIRST_REAL_RUN.md); E001 =
# second run (60 inputs/task, 2026-11-17, docs/07_SECOND_RUN.md).  Where a choice can be
# MEASURED before labelling (whether thinking pays off), it is no longer set by hand: the
# escalation probe measures it on held-out examples for each task, every run.

backend:
  kind: openai                         # any OpenAI-style server: vLLM, FlagScale, llama.cpp ...
  base_url: http://127.0.0.1:2026/v1
  model: Qwen3-4B
  structured_api: structured_outputs   # vLLM >= 0.12.  Older vLLM: guided.  No support: none.
  thinking_control: true               # send chat_template_kwargs.enable_thinking
  timeout_s: 900                       # E001: 7 read timeouts at 600 s while 40 thinking sequences queued
  max_attempts: 5
  response_cache: true                 # keep answers on disk; reruns and resumes are free

defaults:
  workers: 8
  split_seed: 42
  calib_limit: 300
  splits:
    calib: 300        # fits calibration + conformal threshold, verifies induced programs
    dev: 300          # compares strategies; never appears in a prompt
    holdout: 200      # touched once, at the very end
  context:
    selection: coverage         # coverage | random | first
    coverage_target: queries    # cover what the inputs we must label look like
    label_balance: 0.5          # 0 = natural label shares, 1 = equal shares
    bulk_order: interleave      # no long runs of one label
    n_clusters: 1               # prompt beginnings per task (1 = maximum cache reuse)
    global_frac: 0.5            # with clusters: share of examples common to all of them
    tail_k: 12                  # nearest examples placed right before the input
    tail_per_label: 2           # ...including the nearest of every label
    tail_as_turns: true         # nearest examples as real chat turns
    restate_rule: true          # repeat the output rule right before the input
  strategy:
    use_program: true           # exact tasks: model writes a program, we verify it
    induction_examples: 48      # the program-writing prompt shows this many examples (not 30K tokens)
    induction_max_tokens: 4096  # room for thinking AND the code; E000 ran out at 2048 and got no code
    induction_rounds: 4
    use_scoring: true           # classification: read label probabilities
    calibration: stack          # none | batch | vector | stack (stack adds model-free signals)
    conformal_alpha: 0.1        # allowed miss rate of the "plausible labels" set
    min_singleton_accuracy: 0.85  # the cheap rung may stop the ladder only if its sure answers
                                  # were this accurate on held-out examples (E000 task 2: 29%)
    escalate: true              # unsure -> think + vote
    escalation_probe: 40        # measure cheap vs thinking on 40 held-out inputs; pick the policy from that
    probe_p_value: 0.10         # spending more compute needs a paired-test win at this level
    vote_n: 5
    think_max_tokens: 1024
    think_temperature: 0.6      # Qwen3's recommended sampling for thinking mode
    cheap_samples: 3
    agree_share: 0.67
    induce_guidelines: false    # turn on per task after `cairn tune` says it helps
    abstain_on_proven_wrong: true  # task 8: a kernel proven wrong lowers S_exec^2/S_call; hand in a loud stub

tasks:
  # Concurrency rule: workers x vote_n <= the server's --max-num-seqs (16 on the Kaggle setup).
  # Every input of tasks 1-4 may reason (5 sequences each), so 3 workers = 15 sequences.  With
  # 8 workers (40 sequences) E001 queued requests past the 600 s timeout and retried them.
  #
  # Exact-procedure tasks.  E001: verified programs answered 60/60 on tasks 1 and 3.  Task 4's
  # program failed on a type confusion (fixed in the induction prompt); the backup path below
  # was right on 80% at 64 minutes per 60 inputs.
  1: { workers: 3, context: { tail_k: 8 }, strategy: { think_max_tokens: 2048 } }
  3: { workers: 3, context: { tail_k: 8 }, strategy: { think_max_tokens: 2048 } }
  4: { workers: 3, context: { tail_k: 8 }, strategy: { think_max_tokens: 2048 } }
  # Counting nouns/verbs.  E002: 43%.  Thinking hit its 768-token limit on 124 of 200 samples,
  # and the labels follow a convention the definition never states (compounds count per word,
  # helper verbs do not; measured in docs/08_THIRD_RUN.md).  Now: the convention is in the
  # system prompt (task card), and the first rung LISTS the words in a constrained format
  # while code counts them.  The probe compares that rung with thinking at a budget that
  # can finish (1536 tokens).
  # E003: listing scored 13/40 in the probe; 12/60 dev inputs had no usable thinking vote.
  # Evaluate position masks as the cheap arm and as recovery after an empty thinking vote.
  2:
    workers: 3
    context: { structural_neighbors: true, tail_per_label: 0 }
    strategy: { use_scoring: false, use_word_mask: true, think_max_tokens: 1536 }
  # Tweet sadness and same-genre: one-token scoring with stacked calibration is the cheap
  # rung (E001: 85% and 96% on what it answered).  Escalation looked harmful in both runs
  # (task 5: 1 of 5 in E000; task 6: the 4 escalated inputs had 3 right before thinking and
  # 2 after, E001).  The probe decides; the hand-set `escalate: false` for task 5 is gone.
  5: {}
  6: {}
  # Trivia.  E000/E001 compared the rungs on DIFFERENT inputs (thinking only saw the hard
  # ones) and wrongly concluded thinking adds nothing.  E002's paired probe: thinking 38% vs
  # cheap 20% on the same 40 inputs (9 vs 2 disagreements, p = 0.065).  The probe now tests
  # the overall difference first, so it can act on that.
  7:
    workers: 3
    strategy: { escalation_probe: 80, use_clue_expansion: true }  # fixed before the next run
    context: { n_clusters: 4, tail_k: 16 }      # trivia: topic-specific examples help the tail
  # Kernels.  Measure on the TEST inputs (`--split test --limit 24`): the 184 demonstration
  # kernels have no wrapper signature, so dev inputs can never be executed (E001: 24/24 not_run).
  8:
    workers: 4
    context: { n_clusters: 4, tail_k: 3 }       # kernels are long; 3 nearest ones is plenty
    strategy: { codegen_rounds: 3, codegen_candidates: 2, codegen_execute: true }
