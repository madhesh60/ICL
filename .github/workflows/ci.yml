name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check cairn tests
          ruff format --check cairn tests
      - name: Tests (kernel execution tests skip without torch + triton)
        run: pytest -m "not triton"

  kernel-checks:
    # Runs generated-kernel checks for real, on CPU, through Triton's interpreter mode.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -e ".[dev]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install triton
      - run: pytest -m triton
